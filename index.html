<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookList - Simple Reading Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1>📚 BookList</h1>
        <p class="subtitle">Track your reading journey with ease</p>
      </div>
      <div class="stats-wrapper" id="statsWrapper" aria-label="Book summary statistics">
        <div class="stat-card">
          <span class="stat-value" id="totalBooksCount">0</span>
          <span class="stat-label">Total Books</span>
        </div>
        <div class="stat-card stat-read">
          <span class="stat-value" id="readBooksCount">0</span>
          <span class="stat-label">Read</span>
        </div>
        <div class="stat-card stat-unread">
          <span class="stat-value" id="unreadBooksCount">0</span>
          <span class="stat-label">Unread</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Add / Edit Book Form Section -->
      <section class="card form-card">
        <h2 id="formHeading">Add a New Book</h2>
        <form id="bookForm" novalidate>
          <input type="hidden" id="bookIdInput">

          <div class="form-field">
            <label for="titleInput">Book Title <span class="required">*</span></label>
            <input 
              type="text" 
              id="titleInput" 
              placeholder="e.g. To Kill a Mockingbird" 
              required 
              autocomplete="off"
            >
            <small class="error-msg" id="titleError"></small>
          </div>

          <div class="form-field">
            <label for="authorInput">Author <span class="required">*</span></label>
            <input 
              type="text" 
              id="authorInput" 
              placeholder="e.g. Harper Lee" 
              required 
              autocomplete="off"
            >
            <small class="error-msg" id="authorError"></small>
          </div>

          <div class="form-field">
            <label for="starRatingPicker">Rating (1 to 5 stars)</label>
            <div class="star-rating-picker" id="starRatingPicker" role="radiogroup" aria-label="Book rating from 1 to 5">
              <button type="button" class="star-btn" data-value="1" aria-label="1 star">★</button>
              <button type="button" class="star-btn" data-value="2" aria-label="2 stars">★</button>
              <button type="button" class="star-btn" data-value="3" aria-label="3 stars">★</button>
              <button type="button" class="star-btn" data-value="4" aria-label="4 stars">★</button>
              <button type="button" class="star-btn" data-value="5" aria-label="5 stars">★</button>
              <span class="rating-display-text" id="ratingDisplayText">5 / 5 stars</span>
            </div>
            <input type="hidden" id="ratingInput" value="5">
          </div>

          <div class="form-field checkbox-field">
            <label class="custom-checkbox" for="readCheckbox">
              <input type="checkbox" id="readCheckbox">
              <span class="checkmark"></span>
              <span class="checkbox-text">Mark as read</span>
            </label>
          </div>

          <div class="form-buttons">
            <button type="submit" id="submitBtn" class="btn btn-primary">
              <span id="submitBtnText">Add Book</span>
            </button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary hidden">
              Cancel
            </button>
          </div>
        </form>
      </section>

      <!-- Book List & Search Section -->
      <section class="card list-card">
        <div class="list-header">
          <h2>My Books</h2>
          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="search" 
              id="searchInput" 
              placeholder="Search by title or author..." 
              aria-label="Search books"
              autocomplete="off"
            >
            <button type="button" id="clearSearchBtn" class="clear-search-btn hidden" aria-label="Clear search">&times;</button>
          </div>
        </div>

        <!-- Book items container -->
        <div id="bookList" class="book-list" role="list"></div>

        <!-- Empty state message -->
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon" id="emptyIcon">📖</div>
          <h3 id="emptyTitle">Your book list is empty</h3>
          <p id="emptyDescription">Start tracking your library by adding your first book above.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Delete Confirmation Modal Dialog -->
  <dialog id="deleteDialog" class="confirm-modal">
    <div class="modal-box">
      <h3>Delete Book</h3>
      <p id="deleteDialogMessage">Are you sure you want to delete this book?</p>
      <div class="modal-buttons">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
